[package]
name = "officespire-overlay"
version = "0.6.0-alpha.3"
description = "OfficeSpire STS2 overlay client"
authors = ["AplusNeutrino"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
