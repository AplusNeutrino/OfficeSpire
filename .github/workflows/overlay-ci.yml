name: Overlay CI
on:
  push:
    paths: ["src/OfficeSpire.Overlay/**", ".github/workflows/overlay-ci.yml"]
  pull_request:
    paths: ["src/OfficeSpire.Overlay/**", ".github/workflows/overlay-ci.yml"]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/OfficeSpire.Overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/OfficeSpire.Overlay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
