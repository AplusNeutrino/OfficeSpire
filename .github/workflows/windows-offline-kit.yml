name: Windows Offline Kits

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-offline-kit.yml"
      - "scripts/*offline.ps1"
      - "src/OfficeSpire.Overlay/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/OfficeSpire.Overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/OfficeSpire.Overlay/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev

  build:
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Lite
            config_args: ""
          - edition: Full-Offline
            config_args: "--config src-tauri/tauri.offline.conf.json"
    defaults:
      run:
        working-directory: src/OfficeSpire.Overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/OfficeSpire.Overlay/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/OfficeSpire.Overlay/src-tauri -> target
      - run: npm ci
      - name: Generate bundle icons
        run: npm run tauri icon src-tauri/icons/icon.svg
      - name: Build Tauri bundle
        shell: pwsh
        run: npm run tauri build -- ${{ matrix.config_args }}
      - name: Stage downloadable kit
        shell: pwsh
        env:
          EDITION: ${{ matrix.edition }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "OfficeSpire-Overlay-$env:EDITION-Windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -LiteralPath "src-tauri/target/release/officespire-overlay.exe" -Destination $stage
          Copy-Item -Path "src-tauri/target/release/bundle/*" -Destination $stage -Recurse

          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          [ordered]@{
            schema_version = 1
            component = "OfficeSpire Overlay"
            version = $package.version
            edition = $env:EDITION
            architecture = "windows-x64"
            source_commit = $env:SOURCE_COMMIT
            generated_utc = [DateTimeOffset]::UtcNow.ToString("O")
            includes_mod = $false
            includes_webview2_offline_installer = ($env:EDITION -eq "Full-Offline")
            publication_performed = $false
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $stage "VERSION.json") -Encoding utf8

          @"
          OfficeSpire Overlay $env:EDITION

          This archive contains the unsigned Windows Overlay only. It does not
          contain OfficeSpire.dll or any Slay the Spire 2 game files.

          Lite uses the normal Tauri WebView2 bootstrap behavior.
          Full-Offline embeds the WebView2 offline installer.

          Install with the MSI or setup EXE under the bundle directories, or run
          officespire-overlay.exe as the portable application.
          "@ | Set-Content -LiteralPath (Join-Path $stage "README.txt") -Encoding utf8

          $checksums = Get-ChildItem -LiteralPath $stage -File -Recurse |
            Where-Object Name -ne "SHA256SUMS.txt" |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            }
          $checksums | Set-Content -LiteralPath (Join-Path $stage "SHA256SUMS.txt") -Encoding utf8

          $archive = Join-Path $env:RUNNER_TEMP "OfficeSpire-Overlay-$env:EDITION-Windows-x64.zip"
          Compress-Archive -LiteralPath $stage -DestinationPath $archive -CompressionLevel Optimal
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$archiveHash  $([IO.Path]::GetFileName($archive))" -Encoding utf8
          "OFFLINE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeSpire-Overlay-${{ matrix.edition }}-Windows-x64
          path: |
            ${{ env.OFFLINE_ARCHIVE }}
            ${{ env.OFFLINE_ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 90
